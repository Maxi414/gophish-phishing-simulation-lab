# Reverse proxy in front of GoPhish.
# Terminates TLS on 443, forwards to the phishing server bound to localhost:8080,
# and strips the headers that fingerprint GoPhish (X-Gophish-*) plus the Server token.
# Requires: libnginx-mod-http-headers-more-filter (for more_clear_headers).

server {
    listen 443 ssl;
    server_name 192.168.0.221;

    ssl_certificate     /etc/ssl/certs/gophish.crt;
    ssl_certificate_key /etc/ssl/private/gophish.key;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove GoPhish's fingerprinting headers
        proxy_hide_header X-Gophish-Contact;
        proxy_hide_header X-Gophish-Signature;

        # Remove the Server: nginx header entirely
        more_clear_headers Server;
    }
}

server {
    listen 80;
    server_name 192.168.0.221;
    return 301 https://$host$request_uri;
}
